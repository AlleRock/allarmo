<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ALLARMO v4.3.1 - Precision Move</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ALLARMO">
    
    <link rel="apple-touch-icon" href="./icona.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#10b981">
    
    <link href="./vendor/cropper.min.css" rel="stylesheet">
    <script src="./vendor/cropper.min.js"></script>
    
    <link href="./vendor/fonts.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-bg: #05070a;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden;
        }

        .nav-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            height: calc(70px + env(safe-area-inset-bottom));
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 2000;
        }

        .nav-item {
            color: #666; font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
            display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer;
        }

        .nav-item.active { color: var(--accent-green); }

        .page {
            display: none; padding: 20px; width: 100%; max-width: 480px; margin: 0 auto;
            padding-bottom: 120px; animation: fadeIn 0.3s ease;
        }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        header { text-align: center; margin-bottom: 30px; padding-top: env(safe-area-inset-top); }
        h1 { font-weight: 800; font-size: 2.4rem; margin: 0; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { font-size: 0.7rem; letter-spacing: 4px; color: var(--accent-green); text-transform: uppercase; font-weight: 800; }

        .card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 30px; padding: 25px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 800; color: #a1a1aa; text-transform: uppercase; }
        input { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px; color: white; margin-bottom: 20px; outline: none; }
        
        #save-btn { width: 100%; background: #fff; border: none; border-radius: 12px; padding: 18px; color: #000; font-weight: 800; text-transform: uppercase; }

        .timer-item {
            background-color: #111; background-size: cover; background-position: center;
            border: 1px solid var(--glass-border); border-radius: 26px; margin-bottom: 25px;
            overflow: hidden; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .timer-header { 
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 100%);
            padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; 
        }

        .timer-display { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 1.7rem; padding: 45px 10px; text-align: center; font-weight: 800;
            text-shadow: 0px 2px 10px rgba(0,0,0,1), 0px 0px 20px rgba(0,0,0,0.8);
        }
        
        .btn-action { background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 0.65rem; padding: 8px 12px; border-radius: 8px; font-weight: 800; text-transform: uppercase; backdrop-filter: blur(5px); }
        .btn-move { background: rgba(255,255,255,0.1); padding: 5px 10px; font-size: 0.8rem; }
        .btn-edit { background: #3b82f6; } .btn-del { background: var(--accent-red); }

        .btn-ios { width: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px); border: none; color: var(--accent-green); padding: 14px; font-weight: 800; font-size: 0.75rem; letter-spacing: 1px; border-top: 1px solid var(--glass-border); }

        .modal-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; background-size: cover; background-position: center; z-index: 3000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .modal-view.active { display: flex; }
        .close-x { position: absolute; top: 50px; right: 20px; color: white; font-size: 2rem; background: rgba(0,0,0,0.6); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); z-index: 3100; }

        #cropper-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 4000; display: none; flex-direction: column; }
        .cropper-box { flex: 1; overflow: hidden; }
        .cropper-footer { padding: 20px; display: flex; gap: 10px; background: #111; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }

        .future { color: var(--accent-green); } .past { color: var(--accent-red); }
    </style>
</head>
<body>

    <div id="cropper-container">
        <div class="cropper-box"><img id="crop-target" src=""></div>
        <div class="cropper-footer">
            <button class="btn-action" onclick="cancelCrop()" style="flex:1; background:#333;">Annulla</button>
            <button class="btn-action" onclick="confirmCrop()" style="flex:1; background:var(--accent-green);">Taglia e Salva</button>
        </div>
    </div>

    <div id="page-setup" class="page active">
        <header>
            <h1>ALLARMO</h1>
            <div class="subtitle">Persistenza Immersiva</div>
        </header>
        <section class="card">
            <label>NOME EVENTO</label>
            <input type="text" id="name" placeholder="Es. Prossimo Step" autocomplete="off">
            <label>SCADENZA</label>
            <input type="datetime-local" id="date">
            <label>FOTO SFONDO</label>
            <input type="file" id="image-input" accept="image/*" onchange="startCropper(event)" style="margin-bottom:20px; color:#fff;">
            <button id="save-btn" onclick="handleSave()">Attiva Monitoraggio</button>
        </section>
        <section class="card" style="padding: 15px;">
            <label>Power Tools</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn-action" onclick="exportJSON()" style="padding: 15px;">Export JSON</button>
                <button class="btn-action" onclick="document.getElementById('import-file').click()" style="padding: 15px;">Import JSON</button>
            </div>
            <input type="file" id="import-file" style="display:none" onchange="importJSON(event)">
        </section>
        <footer style="opacity: 0.3; font-size: 0.6rem; text-align: center;">© 2026 - ARCHITECTED BY MASTRO PROGRAMMO</footer>
    </div>

    <div id="page-monitor" class="page">
        <header><div class="subtitle" style="margin-bottom: 20px;">Live Monitoring</div></header>
        <div id="list"></div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" id="nav-setup" onclick="switchPage('setup')"><span>⚙️</span><span>Setup</span></div>
        <div class="nav-item" id="nav-monitor" onclick="switchPage('monitor')"><span>⏱️</span><span>Timer</span></div>
    </nav>

    <div id="modal-view" class="modal-view">
        <button class="close-x" onclick="closeModal()">×</button>
        <div id="modal-title" style="font-size:2rem; font-weight:800; text-align:center; padding: 0 20px; text-shadow: 0 4px 15px #000;"></div>
        <div id="modal-display" style="font-family: 'JetBrains Mono', monospace; font-size:3rem; text-shadow: 0 4px 20px #000; font-weight: 800;"></div>
    </div>

    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const STORAGE_KEY = 'allarmo_v4_2';
        let savedRaw = null, storageReadFailed = false, damagedArchive = false;
        let timers = loadTimers();
        let activeId = null, audioEnabled = false, editingId = null, cropper = null, tempImgData = null;
        let automaticSaveFailed = false;

        function validImage(value) {
            if (value == null) return true;
            if (typeof value !== 'string') return false;
            if (/^data:image\/(png|jpe?g|gif|webp|bmp|avif|x-icon);base64,[a-z0-9+/=\s]+$/i.test(value)) return true;
            try { return ['https:', 'http:'].includes(new URL(value, document.baseURI).protocol); }
            catch (err) { return false; }
        }

        function validateTimers(data) {
            if (!Array.isArray(data)) throw new Error('Il file deve contenere un elenco di timer.');
            const ids = new Set();
            return data.map((t, index) => {
                const dateInput = document.createElement('input');
                dateInput.type = 'datetime-local';
                dateInput.value = typeof t?.targetISO === 'string' ? t.targetISO : '';
                if (!t || typeof t !== 'object' || Array.isArray(t) ||
                    !((typeof t.id === 'number' && Number.isFinite(t.id)) || (typeof t.id === 'string' && t.id.length > 0)) ||
                    ids.has(String(t.id)) || typeof t.name !== 'string' ||
                    typeof t.target !== 'number' || !Number.isFinite(t.target) || !Number.isFinite(new Date(t.target).getTime()) ||
                    !dateInput.value || !Number.isFinite(new Date(t.targetISO).getTime()) ||
                    !validImage(t.image) || (t.fired !== undefined && typeof t.fired !== 'boolean')) {
                    throw new Error(`Il timer ${index + 1} contiene dati non validi o un identificativo duplicato.`);
                }
                ids.add(String(t.id));
                return { ...t, image: t.image ?? null, fired: t.fired ?? false };
            });
        }

        function loadTimers() {
            try { savedRaw = localStorage.getItem(STORAGE_KEY); }
            catch (err) {
                storageReadFailed = true;
                setTimeout(() => alert('Impossibile leggere i timer salvati. Il browser non consente l’accesso alla memoria. Nessun dato è stato modificato.'), 0);
                return [];
            }
            if (savedRaw === null) return [];
            try { return validateTimers(JSON.parse(savedRaw)); }
            catch (err) {
                damagedArchive = true;
                setTimeout(() => alert('L’archivio dei timer non è leggibile. L’originale è stato conservato: usa Export JSON per scaricarlo. Puoi ripristinare un backup valido con Import JSON; prima verrà conservata anche una copia locale dell’originale.'), 0);
                return [];
            }
        }

        // Publish changes in memory only after the browser has saved them successfully.
        function sync(next = timers, recover = false) {
            if (storageReadFailed) { alert('Salvataggio non disponibile: impossibile leggere la memoria del browser. Nessun dato è stato sostituito.'); return false; }
            if (damagedArchive && !recover) { alert('L’archivio originale è protetto. Usa Export JSON per recuperarlo e Import JSON per ripristinare un backup valido. Nessun dato è stato sostituito.'); return false; }
            try {
                if (damagedArchive && !confirm('Ripristinare questo backup? L’archivio danneggiato verrà conservato in una copia locale prima di sostituirlo.')) return false;
                if (localStorage.getItem(STORAGE_KEY) !== savedRaw) {
                    alert('I timer salvati sono cambiati in un’altra finestra. Esporta i dati aperti, poi ricarica la pagina. Nessun dato è stato sovrascritto.');
                    return false;
                }
                const json = JSON.stringify(next);
                if (damagedArchive) {
                    let suffix = Date.now(), key;
                    do { key = `${STORAGE_KEY}_recovery_${suffix++}`; } while (localStorage.getItem(key) !== null);
                    localStorage.setItem(key, savedRaw);
                }
                localStorage.setItem(STORAGE_KEY, json);
                savedRaw = json;
                timers = next;
                damagedArchive = false;
                automaticSaveFailed = false;
                return true;
            } catch (err) {
                alert('Salvataggio non riuscito: la memoria del browser potrebbe essere piena o non disponibile. I dati già salvati sono intatti. La modifica non è stata applicata; puoi riprovare o usare Export JSON.');
                return false;
            }
        }

        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');
            document.getElementById('nav-' + page).classList.add('active');
        }

        function startCropper(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onerror = () => alert('Impossibile leggere l’immagine. I timer non sono stati modificati.');
            reader.onload = (e) => {
                if (typeof Cropper === 'undefined') { alert('Il ritaglio immagini non è disponibile. Riapri l’app online per completare il caricamento.'); return; }
                document.getElementById('crop-target').src = e.target.result;
                document.getElementById('cropper-container').style.display = 'flex';
                if (cropper) cropper.destroy();
                cropper = new Cropper(document.getElementById('crop-target'), { aspectRatio: 16 / 9, viewMode: 1 });
            };
            reader.readAsDataURL(file);
        }
        function cancelCrop() { document.getElementById('cropper-container').style.display = 'none'; document.getElementById('image-input').value = ''; }
        function confirmCrop() {
            try {
                tempImgData = cropper.getCroppedCanvas({ width: 800 }).toDataURL('image/jpeg', 0.8);
                document.getElementById('cropper-container').style.display = 'none';
            } catch (err) { alert('Impossibile ritagliare l’immagine. Riprova con un’altra foto. I timer non sono stati modificati.'); }
        }

        async function silentPermission() {
            if (!audioEnabled) {
                const beep = document.getElementById('beep');
                try { await beep.play(); beep.pause(); beep.currentTime = 0; audioEnabled = true; } catch (e) {}
            }
        }

        function handleSave() {
            silentPermission();
            const nIn = document.getElementById('name'), dIn = document.getElementById('date');
            if (!nIn.value || !dIn.value) return alert('Dati incompleti!');
            const previous = timers.find(t => t.id === editingId);
            finalizeSave(nIn.value, dIn.value, tempImgData || previous?.image || null);
        }

        function finalizeSave(n, d, img) {
            const target = new Date(d).getTime();
            if (!Number.isFinite(target)) { alert('La data dell’evento non è valida.'); return; }
            const next = timers.slice();
            if (editingId !== null) {
                const idx = next.findIndex(t => t.id === editingId);
                if (idx < 0) { alert('Il timer da modificare non è più presente.'); return; }
                next[idx] = { ...next[idx], name: n, target, targetISO: d, image: img, fired: false };
            } else {
                let id = Date.now();
                while (next.some(t => String(t.id) === String(id))) id++;
                next.push({ id, name: n, target, targetISO: d, image: img, fired: false });
            }
            if (!sync(next)) return;
            editingId = null; tempImgData = null;
            document.getElementById('save-btn').innerText = 'Attiva Monitoraggio';
            render(); switchPage('monitor');
            document.getElementById('name').value = ''; document.getElementById('date').value = ''; document.getElementById('image-input').value = '';
        }

        function moveUp(id, e) { e.stopPropagation(); moveTimer(id, -1); }
        function moveDown(id, e) { e.stopPropagation(); moveTimer(id, 1); }
        function moveTimer(id, step) {
            const idx = timers.findIndex(t => t.id === id), dest = idx + step;
            if (idx < 0 || dest < 0 || dest >= timers.length) return;
            const next = timers.slice();
            [next[idx], next[dest]] = [next[dest], next[idx]];
            if (sync(next)) render();
        }

        function editTimer(id, e) {
            e.stopPropagation(); const t = timers.find(x => x.id === id);
            if (!t) return;
            editingId = id; tempImgData = null;
            document.getElementById('image-input').value = '';
            document.getElementById('name').value = t.name; document.getElementById('date').value = t.targetISO;
            document.getElementById('save-btn').innerText = 'Salva Modifiche'; switchPage('setup');
        }
        function deleteTimer(id, e) {
            e.stopPropagation();
            if (confirm('Eliminare?') && sync(timers.filter(t => t.id !== id))) render();
        }
        function imageBackground(element, image) { element.style.backgroundImage = image ? `url(${JSON.stringify(image)})` : 'none'; }
        function openModal(id) {
            const t = timers.find(x => x.id === id); if (!t) return;
            activeId = id; const m = document.getElementById('modal-view');
            document.getElementById('modal-title').textContent = t.name;
            imageBackground(m, t.image); m.classList.add('active');
        }
        function closeModal() { activeId = null; document.getElementById('modal-view').classList.remove('active'); }

        function render() {
            const l = document.getElementById('list');
            l.textContent = '';
            if (timers.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'text-align:center; opacity:0.3; margin-top:50px;';
                empty.textContent = 'Nessun timer attivo'; l.appendChild(empty); return;
            }
            const button = (label, classes, action) => {
                const b = document.createElement('button'); b.className = classes; b.textContent = label;
                b.addEventListener('click', e => { e.stopPropagation(); action(e); }); return b;
            };
            timers.forEach(t => {
                const card = document.createElement('div'); card.className = 'timer-item';
                imageBackground(card, t.image); card.addEventListener('click', () => openModal(t.id));
                const header = document.createElement('div'); header.className = 'timer-header';
                const moves = document.createElement('div'); moves.style.cssText = 'display:flex; gap:5px;';
                moves.appendChild(button('▲', 'btn-action btn-move', e => moveUp(t.id, e)));
                moves.appendChild(button('▼', 'btn-action btn-move', e => moveDown(t.id, e)));
                const name = document.createElement('span');
                name.style.cssText = 'font-weight:800; font-size:0.85rem; text-shadow: 0 2px 4px #000; flex:1; text-align:center;';
                name.textContent = t.name;
                const actions = document.createElement('div'); actions.style.cssText = 'display:flex; gap:8px;';
                actions.appendChild(button('Edit', 'btn-action btn-edit', e => editTimer(t.id, e)));
                actions.appendChild(button('×', 'btn-action btn-del', e => deleteTimer(t.id, e)));
                header.appendChild(moves); header.appendChild(name); header.appendChild(actions);
                const clock = document.createElement('div'); clock.className = 'timer-display';
                clock.id = `clock-${t.id}`; clock.textContent = '--:--:--:--';
                card.appendChild(header); card.appendChild(clock);
                card.appendChild(button('SYNC CALENDAR', 'btn-ios', () => downloadICS(t.name, t.targetISO)));
                l.appendChild(card);
            });
        }

        function tick() {
            const now = Date.now(); let changed = false;
            timers.forEach(t => {
                const diff = t.target - now, isPast = diff < 0, abs = Math.abs(diff);
                const d = Math.floor(abs/86400000), h = Math.floor((abs%86400000)/3600000).toString().padStart(2,'0'), m = Math.floor((abs%3600000)/60000).toString().padStart(2,'0'), s = Math.floor((abs%60000)/1000).toString().padStart(2,'0');
                const str = `${isPast ? '+ ' : '- '}${d}D ${h}H ${m}' ${s}"`;
                const clk = document.getElementById(`clock-${t.id}`);
                if (clk) { clk.innerText = str; clk.className = `timer-display ${isPast ? 'past' : 'future'}`; }
                if (activeId === t.id) { document.getElementById('modal-display').innerText = str; document.getElementById('modal-display').className = `timer-display ${isPast ? 'past' : 'future'}`; }
                if (isPast && !t.fired) {
                    if (audioEnabled) document.getElementById('beep').play().catch(() => {});
                    t.fired = true; changed = true;
                }
            });
            // Do not repeat a failing automatic save every second.
            if (changed && !automaticSaveFailed) automaticSaveFailed = !sync();
        }

        function downloadFile(content, type, filename) {
            const url = URL.createObjectURL(new Blob([content], { type })), link = document.createElement('a');
            link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        }
        function exportJSON() {
            if (storageReadFailed) { alert('Impossibile esportare: l’archivio salvato non è accessibile. Nessun dato è stato modificato.'); return; }
            downloadFile(damagedArchive ? savedRaw : JSON.stringify(timers), 'application/json;charset=utf-8', 'allarmo_backup.json');
        }
        function importJSON(e) {
            const input = e.target, file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onerror = () => { alert('Impossibile leggere il file. I timer esistenti non sono stati modificati.'); input.value = ''; };
            reader.onload = () => {
                try {
                    const imported = validateTimers(JSON.parse(reader.result));
                    if (!sync(imported, true)) return;
                    editingId = null; tempImgData = null;
                    document.getElementById('save-btn').innerText = 'Attiva Monitoraggio';
                    render(); alert('Importato!');
                } catch (err) { alert('Importazione non riuscita: il file JSON non contiene un archivio di timer valido. I timer esistenti non sono stati modificati.'); }
                finally { input.value = ''; }
            };
            reader.readAsText(file);
        }

        function escapeICSText(value) {
            return value.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '')
                .replace(/\\/g, '\\\\').replace(/\r\n|\r|\n/g, '\\n').replace(/;/g, '\\;').replace(/,/g, '\\,');
        }
        function foldICSLine(line) {
            const encoder = new TextEncoder(); let result = '', octets = 0;
            for (const character of line) {
                const size = encoder.encode(character).length;
                if (octets + size > 75) { result += '\r\n '; octets = 1; }
                result += character; octets += size;
            }
            return result;
        }
        function buildICS(n, dS) {
            const date = new Date(dS), format = d => d.toISOString().replace(/-|:|\.\d+/g, '');
            const uid = `${Date.now()}-${Array.from(crypto.getRandomValues(new Uint32Array(2)), v => v.toString(16)).join('')}@allarmo.local`;
            const summary = escapeICSText('ALLARMO: ' + n);
            return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ALLARMO//IT', 'BEGIN:VEVENT',
                `UID:${uid}`, `DTSTAMP:${format(new Date())}`, `SUMMARY:${summary}`,
                `DTSTART:${format(date)}`, `DTEND:${format(new Date(date.getTime() + 60000))}`,
                'BEGIN:VALARM', 'TRIGGER:-PT0M', 'ACTION:DISPLAY', `DESCRIPTION:${summary}`,
                'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].map(foldICSLine).join('\r\n') + '\r\n';
        }
        function downloadICS(n, dS) {
            try { downloadFile(buildICS(n, dS), 'text/calendar;charset=utf-8', `${n}.ics`); }
            catch (err) { alert('Impossibile esportare l’evento: verifica che la data sia valida. I timer non sono stati modificati.'); }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
                    .catch(err => console.warn('ALLARMO: modalità offline non disponibile.', err));
            });
        }
        setInterval(tick, 1000);
        render();

    </script>
</body>
</html>
